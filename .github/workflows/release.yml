name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release a new version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm size

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Bump version, commit and tag
        id: version
        run: |
          pnpm version ${{ inputs.version }} --no-git-checks --no-git-tag-version
          version=$(jq -r .version package.json)
          git commit -am "chore: release v$version" --no-verify
          git tag -am "Release v$version" "v$version"
          git push --follow-tags
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Check for a previous tag
        id: prev
        run: |
          if git describe --tags --abbrev=0 "${{ steps.version.outputs.tag }}^" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # Needs a previous tag; the first release falls back to GitHub's generated notes.
      - name: Generate changelog
        id: changelog
        if: steps.prev.outputs.exists == 'true'
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.tag }}
          writeToFile: false
          includeRefIssues: true
          includeInvalidCommits: true
          restrictToTypes: feat,perf,fix,docs,refactor

      - name: Draft GitHub release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          makeLatest: true
          allowUpdates: true
          tag: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.changes }}
          generateReleaseNotes: ${{ steps.prev.outputs.exists != 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}
